<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parser EXAR</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #222;
      background: #7E8896;
    }

    main {
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font: 15px monospace;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin: 12px 0;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: #2457a7;
      cursor: pointer;
    }

    button:hover {
      background: #17427f;
    }

    #parser-clear {
      background: #555;
    }

    #parser-clear:hover {
      background: #3d3d3d;
    }

    #parser-resultados {
      margin-top: 18px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #cfd6df;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #d9e0e8;
      border-right: 1px solid #d9e0e8;
      text-align: left;
      vertical-align: middle;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    thead th {
      background: #eaf0f8;
      color: #1c3557;
      font-weight: bold;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    td.fila-aviso {
      text-align: center;
      color: #445063;
      background: #f6f8fa;
      font-weight: bold;
      padding: 14px;
    }

    td.col-fila {
      white-space: nowrap;
      font-family: monospace;
      font-weight: bold;
      color: #445063;
      width: 70px;
    }

    td.col-expresion {
      font-family: monospace;
      word-break: break-word;
    }

    td.col-tipo {
      white-space: nowrap;
      font-family: monospace;
      font-weight: bold;
      text-align: center;
      color: #334155;
      width: 80px;
    }

    td.col-codigo {
      white-space: nowrap;
      width: 120px;
    }

    .codigo-badge {
      display: inline-block;
      padding: 3px 8px;
      margin-right: 4px;
      border-radius: 999px;
      font-family: monospace;
      font-weight: bold;
      font-size: 13px;
    }

    .codigo-badge:last-child {
      margin-right: 0;
    }

    tr.fila-ok {
      background: #f6fcf8;
    }

    tr.fila-ok .codigo-badge {
      background: #d8f3df;
      color: #15622e;
    }

    tr.fila-error {
      background: #fff5f5;
    }

    tr.fila-error .codigo-badge {
      background: #fde0e0;
      color: #a61c1c;
    }

    @media (max-width: 550px) {
      body {
        padding: 10px;
      }

      main {
        padding: 16px;
      }

      .buttons {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Parser EXAR</h1>
    <p>Escribe expresiones aritméticas terminadas en punto y coma (<code>;</code>). Puedes escribir una o varias por
      fila; el analizador las separará y verificará con AFD y un Autómata de Pila.</p>

    <label for="parser-input"><strong>Expresiones a analizar</strong></label>
    <textarea id="parser-input" placeholder="Ejemplo:&#10;(X1+B2);&#10;(Y1+B3*C4)+D;"></textarea>

    <div class="buttons">
      <button id="parser-button" type="button">Analizar</button>
      <button id="parser-clear" type="button">Limpiar</button>
    </div>

    <section id="parser-resultados" hidden>
      <div class="table-wrap">
        <table id="parser-tabla">
          <thead>
            <tr>
              <th>Fila</th>
              <th>Expresión</th>
              <th>Tipo</th>
              <th>Código</th>
              <th>Descripción</th>
            </tr>
          </thead>
          <tbody id="parser-tabla-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>

</html>
