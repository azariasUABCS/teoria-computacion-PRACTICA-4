<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parser EXAR</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #222;
      background: #7E8896;
    }

    main {
      min-width: 870px;
      max-width: 871px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font: 15px monospace;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin: 12px 0;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: #2457a7;
      cursor: pointer;
    }

    button:hover {
      background: #17427f;
    }

    #parser-clear {
      background: #555;
    }

    #parser-mensaje {
      margin: 14px 0;
      font-weight: bold;
    }

    #parser-resultados {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .resultado-item.ok {
      color: green;
    }

    .resultado-item.error {
      color: red;
    }

    .resultado-expresion {
      color: #222;
      font-weight: bold;
    }

    @media (max-width: 550px) {
      body {
        padding: 10px;
      }

      main {
        padding: 16px;
      }

      .buttons {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Parser EXAR</h1>
    <p>Escribe expresiones aritméticas terminadas en punto y coma (;). El Parser revisa la sintaxis con un Autómata de Pila.</p>

    <label for="parser-input"><strong>Expresiones a analizar</strong></label>
    <textarea id="parser-input" placeholder="Ejemplo: (X1+B2);"></textarea>

    <div class="buttons">
      <button id="parser-button" type="button">Analizar</button>
      <button id="parser-clear" type="button">Limpiar</button>
    </div>

    <p id="parser-mensaje" role="status">Esperando expresiones para analizar.</p>
    <div id="parser-resultados"></div>
  </main>

  <script src="index.js"></script>
</body>

</html>
